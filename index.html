              navigator.clipboard.writeText(text).catch(function () {});
            } catch (err) {
              /* Ignore clipboard permission restriction in iFrames */
            }
          }
        }

        function showStatus(message) {
          if (!copyStatus) return;
          copyStatus.textContent = message;
          copyStatus.classList.add('is-visible');
          if (statusTimer) {
            clearTimeout(statusTimer);
          }
          statusTimer = setTimeout(function () {
            copyStatus.classList.remove('is-visible');
          }, 6000);
        }

        /* Service selector buttons */
        for (var sb = 0; sb < serviceButtons.length; sb++) {
          serviceButtons[sb].addEventListener('click', function () {
            var val = this.getAttribute('data-service');
            if (val) {
              setActiveService(val);
            }
          });
        }

        /* Niche selector buttons */
        for (var nb = 0; nb < nicheButtons.length; nb++) {
          nicheButtons[nb].addEventListener('click', function () {
            var val = this.getAttribute('data-niche');
            if (val) {
              setActiveNiche(val);
            }
          });
        }

        /* Client name / Instagram handle input */
        if (clientInput) {
          clientInput.addEventListener('input', function () {
            state.clientName = this.value;
            updateBrief();
          });
        }

        /* Preset service buttons from Hero & Service tabs */
        var presetLinks = document.querySelectorAll('.js-select-service');
        for (var pl = 0; pl < presetLinks.length; pl++) {
          presetLinks[pl].addEventListener('click', function (e) {
            var chosenService = this.getAttribute('data-select-service');
            if (chosenService) {
              setActiveService(chosenService);
            }
            var orderSection = document.getElementById('order');
            if (orderSection) {
              e.preventDefault();
              orderSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        }

        /* Click on brief preview box itself copies the text */
        if (briefPreview) {
          briefPreview.addEventListener('click', function () {
            copyTextSilently(buildBriefText());
            showStatus('Текст заявки скопійовано в буфер обміну');
          });
          briefPreview.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              copyTextSilently(buildBriefText());
              showStatus('Текст заявки скопійовано в буфер обміну');
            }
          });
        }

        /* Telegram CTA link: ensure href is fresh, copy silently, allow native navigation */
        if (tgLink) {
          tgLink.addEventListener('click', function () {
            var currentText = buildBriefText();
            tgLink.setAttribute('href', 'https://t.me/fiya_grid?text=' + encodeURIComponent(currentText));
            copyTextSilently(currentText);
            showStatus('Текст підставлено у повідомлення Telegram (@fiya_grid)');
          });
        }

        /* Instagram Direct CTA link: copy text silently, show status, allow native navigation */
        if (igLink) {
          igLink.addEventListener('click', function () {
            copyTextSilently(buildBriefText());
            showStatus('Текст скопійовано — вставте його у відкритому чаті Direct');
          });
        }

        /* Initialize brief & Telegram link immediately on load */
        updateBrief();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initFivisionApp);
      } else {
        initFivisionApp();
      }
    })();
  </script>
</body>
</html>
